name: Release

# Publishing a GitHub Release (tag vX.Y.Z) ships that version:
#   1. verify  - the tag matches pyproject.toml and CHANGELOG.md has an entry for it
#   2. ci      - the full CI workflow (tests on every Python/OS, oldest deps, docs,
#                self-analysis, audit, built-wheel smoke test) produces `dist`
#   3. publish - uploads exactly that `dist` to PyPI via Trusted Publishing (OIDC,
#                no stored token) with PEP 740 attestations
#   4. assets  - attaches the same files to the GitHub Release
# workflow_dispatch runs steps 1-2 only (a dry run of a release).
#
# One-time PyPI setup (https://pypi.org/manage/project/code-quality-analyzer/settings/publishing/):
#   Owner KarthikShivasankar, repository python_smells_detector,
#   workflow publish.yml, environment pypi. Keep this file name and environment.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tag, pyproject.toml and CHANGELOG.md agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "pyproject.toml version: $version"
          grep -q "^## $version\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$TAG" != "v$version" ]; then
            echo "Release tag '$TAG' does not match version v$version"; exit 1
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: ci
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/code-quality-analyzer/
    permissions:
      id-token: write  # Trusted Publishing (OIDC) and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  assets:
    name: Attach distribution to the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload sdist and wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
