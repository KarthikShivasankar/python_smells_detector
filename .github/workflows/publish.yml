name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token or secret is
# stored in the repository. Triggered when a GitHub Release is published.
#
# One-time PyPI setup (https://pypi.org/manage/project/code-quality-analyzer/settings/publishing/):
#   - Owner:            KarthikShivasankar
#   - Repository name:  python_smells_detector
#   - Workflow name:    publish.yml
#   - Environment name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/code-quality-analyzer/
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent: if the version already exists on PyPI, skip instead of
          # failing the run (e.g. re-running a release).
          skip-existing: true
