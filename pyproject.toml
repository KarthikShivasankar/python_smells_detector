[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-quality-analyzer"
version = "0.2.0"
description = "Detect code smells, architectural smells, and structural smells in Python projects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Karthik Shivashankar", email = "karthik13sankar@outlook.com" }
]
keywords = ["code-quality", "static-analysis", "code-smells", "linter", "refactoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Environment :: Console",
]
dependencies = [
    "astroid>=2.0",
    "networkx>=2.0",
    "pyyaml>=5.0",
    "tqdm>=4.0",
]

[project.scripts]
analyze_code_quality = "code_quality_analyzer.main:analyze_project"

[project.optional-dependencies]
dev = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/KarthikShivasankar/code_quality_analyzer"
Repository = "https://github.com/KarthikShivasankar/code_quality_analyzer"
"Bug Tracker" = "https://github.com/KarthikShivasankar/code_quality_analyzer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/code_quality_analyzer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "code_quality_config.yaml",
    "README.md",
    "LICENSE",
]
