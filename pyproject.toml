[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-quality-analyzer"
version = "0.2.2"
description = "Detect code smells, architectural smells, and structural smells in Python projects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Karthik Shivashankar", email = "karthik13sankar@outlook.com" }
]
keywords = ["code-quality", "static-analysis", "code-smells", "linter", "refactoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Environment :: Console",
]
dependencies = [
    "astroid>=2.0",
    "networkx>=2.0",
    "pyyaml>=5.0",
    "tqdm>=4.0",
]

[project.scripts]
analyze_code_quality = "code_quality_analyzer.main:analyze_project"

[project.optional-dependencies]
dev = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/KarthikShivasankar/python_smells_detector"
Repository = "https://github.com/KarthikShivasankar/python_smells_detector"
"Bug Tracker" = "https://github.com/KarthikShivasankar/python_smells_detector/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# F = pyflakes (undefined names, unused imports), E/W = pycodestyle, I = isort.
# Ruff always reports syntax errors regardless of selection, so target-version
# py310 above guards against re-introducing 3.12-only f-string line breaks.
select = ["E", "F", "W", "I"]
# E501 (line-too-long) is intentionally not enforced: the detector modules
# carry many pre-existing long lines. Tighten this incrementally over time.
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/code_quality_analyzer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "code_quality_config.yaml",
    "README.md",
    "LICENSE",
]
